name: Dependency Security and SBOM

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  schedule:
    - cron: "23 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-dependencies:
    if: ${{ hashFiles('requirements.txt') != '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install audit and SBOM tools
        run: python -m pip install --upgrade pip pip-audit cyclonedx-bom
      - name: Audit pinned Python dependencies
        run: pip-audit -r requirements.txt --format json --output pip-audit.json
      - name: Generate CycloneDX SBOM
        run: cyclonedx-py requirements requirements.txt --output-format JSON --output-file sbom-python.cdx.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: python-security-artifacts
          path: |
            pip-audit.json
            sbom-python.cdx.json
          if-no-files-found: ignore

  node-dependencies:
    if: ${{ hashFiles('package-lock.json') != '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Audit npm dependencies
        run: npm audit --json > npm-audit.json
      - name: Generate npm SBOM
        if: always()
        run: npm sbom --sbom-format cyclonedx > sbom-node.cdx.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: node-security-artifacts
          path: |
            npm-audit.json
            sbom-node.cdx.json
          if-no-files-found: ignore
