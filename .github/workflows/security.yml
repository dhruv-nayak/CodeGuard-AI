
name: Dependency Security and SBOM

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  schedule:
    - cron: "23 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check Python requirements file
        id: python-check
        shell: bash
        run: |
          if [ -f requirements.txt ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Python
        if: steps.python-check.outputs.available == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install audit and SBOM tools
        if: steps.python-check.outputs.available == 'true'
        run: python -m pip install --upgrade pip pip-audit cyclonedx-bom

      - name: Audit pinned Python dependencies
        if: steps.python-check.outputs.available == 'true'
        run: pip-audit -r requirements.txt --format json --output pip-audit.json

      - name: Generate CycloneDX SBOM
        if: steps.python-check.outputs.available == 'true'
        run: cyclonedx-py requirements requirements.txt --output-format JSON --output-file sbom-python.cdx.json

      - uses: actions/upload-artifact@v4
        if: always() && steps.python-check.outputs.available == 'true'
        with:
          name: python-security-artifacts
          path: |
            pip-audit.json
            sbom-python.cdx.json
          if-no-files-found: ignore

  node-dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check npm lockfile
        id: node-check
        shell: bash
        run: |
          if [ -f package-lock.json ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Node.js
        if: steps.node-check.outputs.available == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Audit npm dependencies
        if: steps.node-check.outputs.available == 'true'
        run: npm audit --json > npm-audit.json

      - name: Generate npm SBOM
        if: steps.node-check.outputs.available == 'true'
        run: npm sbom --sbom-format cyclonedx > sbom-node.cdx.json

      - uses: actions/upload-artifact@v4
        if: always() && steps.node-check.outputs.available == 'true'
        with:
          name: node-security-artifacts
          path: |
            npm-audit.json
            sbom-node.cdx.json
          if-no-files-found: ignore
