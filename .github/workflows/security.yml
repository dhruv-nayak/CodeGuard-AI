
name: Dependency Security and SBOM

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  schedule:
    - cron: "23 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-dependencies:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Check Python requirements file
        id: python-check
        shell: bash
        run: |
          if [ -f requirements.txt ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Python
        if: steps.python-check.outputs.available == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Create application environment
        if: steps.python-check.outputs.available == 'true'
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install -r requirements.txt

      - name: Upgrade vulnerable setuptools
        if: steps.python-check.outputs.available == 'true'
        run: |
          .venv/bin/python -m pip install --upgrade "setuptools>=84.1.0"
      - name: Install security tools
        if: steps.python-check.outputs.available == 'true'
        run: |
          python -m pip install --upgrade pip-audit cyclonedx-bom

      - name: Audit installed Python dependencies
        if: steps.python-check.outputs.available == 'true'
        run: |
          pip-audit \
            --path .venv/lib/python3.11/site-packages \
            --format json \
            --output pip-audit.json

      - name: Generate installed-environment CycloneDX SBOM
        if: always() && steps.python-check.outputs.available == 'true'
        run: |
          .venv/bin/python -m pip install --upgrade cyclonedx-bom
          .venv/bin/python -m cyclonedx_py environment \
            --output-format JSON \
            --output-file sbom-python.cdx.json

            
      - name: Upload Python security artifacts
        if: always() && steps.python-check.outputs.available == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: python-security-artifacts
          path: |
            pip-audit.json
            sbom-python.cdx.json
          if-no-files-found: ignore

  node-dependencies:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Check npm lockfile
        id: node-check
        shell: bash
        run: |
          if [ -f package-lock.json ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Node.js
        if: steps.node-check.outputs.available == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Audit npm dependencies
        if: steps.node-check.outputs.available == 'true'
        run: npm audit --json > npm-audit.json

      - name: Generate npm SBOM
        if: steps.node-check.outputs.available == 'true'
        run: npm sbom --sbom-format cyclonedx > sbom-node.cdx.json

      - name: Upload Node.js security artifacts
        if: always() && steps.node-check.outputs.available == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: node-security-artifacts
          path: |
            npm-audit.json
            sbom-node.cdx.json
          if-no-files-found: ignore
