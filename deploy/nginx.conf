# Example reverse-proxy configuration for a host-level Nginx installation.
# Obtain and install a real certificate before enabling the HTTPS server.
# Replace codeguard.example.com and certificate paths before deployment.

server {
    listen 80;
    server_name codeguard.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name codeguard.example.com;

    ssl_certificate     /etc/letsencrypt/live/codeguard.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/codeguard.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_timeout 1d;
    ssl_session_cache shared:CodeGuardTLS:10m;
    ssl_session_tickets off;

    client_max_body_size 1m;
    server_tokens off;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    # The application emits HSTS when ENABLE_HSTS=true; avoid duplicate headers here.

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 10s;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
}
